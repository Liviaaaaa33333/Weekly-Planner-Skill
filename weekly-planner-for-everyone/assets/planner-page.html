<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的週行程</title>
<style>
/* Weekly Planner page · v1.3 · tone: soft · anchor hue: baby blue 240
 * pre-emit critique: P4 H5 E4 S5 R5 V4
 * type: system (SF / PingFang TC) · dark: follows system
 */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
  --bg-top: oklch(97.8% 0.010 240);
  --bg-bot: oklch(96% 0.018 238);
  --glow: oklch(90% 0.05 236 / .45);
  --glass: oklch(100% 0 0 / .70);
  --glass-strong: oklch(100% 0 0 / .86);
  --glass-line: oklch(100% 0 0 / .85);
  --shadow: 0 1px 2px oklch(40% 0.04 245 / .06), 0 8px 24px oklch(45% 0.06 245 / .07);
  --ink: oklch(29% 0.035 252);
  --ink-2: oklch(47% 0.03 250);
  --ink-3: oklch(62% 0.025 248);
  --hair: oklch(55% 0.03 245 / .14);
  --accent: oklch(84% 0.068 236);        /* 寶寶藍：填色（淡） */
  --accent-soft: oklch(95% 0.026 236);
  --accent-ink: oklch(54% 0.10 245);     /* 寶寶藍的深色：文字、連結 */
  --on-accent: oklch(24% 0.05 252);       /* 寶寶藍上的字用深藍，對比 >7:1 */
  --warn: oklch(76% 0.11 60);
  --warn-ink: oklch(58% 0.12 52);
  --danger-ink: oklch(53% 0.17 25);
  --focus: oklch(55% 0.15 248);
  --k-admin: oklch(74% 0.11 22);
  --k-due: oklch(80% 0.10 65);
  --k-read: oklch(78% 0.08 150);
  --k-focus: oklch(76% 0.085 248);
  --k-appt: oklch(75% 0.085 305);
  --k-class: oklch(76% 0.03 250);
  --k-routine: oklch(80% 0.065 195);
  --k-commute: oklch(75% 0.02 250);
  --k-other: oklch(80% 0.045 80);
  --radius-l: 22px; --radius-m: 16px; --radius-s: 11px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --ease-out: cubic-bezier(.22,.8,.3,1); --ease-in-out: cubic-bezier(.65,0,.35,1);
  --dur-s: 140ms; --dur-m: 240ms;
  --tabbar-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-top: oklch(19% 0.022 252); --bg-bot: oklch(23% 0.035 245); --glow: oklch(45% 0.09 240 / .30);
    --glass: oklch(30% 0.025 250 / .55); --glass-strong: oklch(28% 0.025 250 / .88); --glass-line: oklch(100% 0 0 / .08);
    --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 28px oklch(0% 0 0 / .25);
    --ink: oklch(95% 0.01 240); --ink-2: oklch(78% 0.02 245); --ink-3: oklch(64% 0.02 245); --hair: oklch(100% 0 0 / .10);
    --accent: oklch(80% 0.075 236); --accent-soft: oklch(36% 0.045 245); --accent-ink: oklch(82% 0.09 236); --on-accent: oklch(20% 0.03 250);
    --warn-ink: oklch(80% 0.13 65); --danger-ink: oklch(75% 0.14 25); --focus: oklch(80% 0.10 236);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg-top: oklch(19% 0.022 252); --bg-bot: oklch(23% 0.035 245); --glow: oklch(45% 0.09 240 / .30);
  --glass: oklch(30% 0.025 250 / .55); --glass-strong: oklch(28% 0.025 250 / .88); --glass-line: oklch(100% 0 0 / .08);
  --shadow: 0 1px 2px oklch(0% 0 0 / .3), 0 10px 28px oklch(0% 0 0 / .25);
  --ink: oklch(95% 0.01 240); --ink-2: oklch(78% 0.02 245); --ink-3: oklch(64% 0.02 245); --hair: oklch(100% 0 0 / .10);
  --accent: oklch(80% 0.075 236); --accent-soft: oklch(36% 0.045 245); --accent-ink: oklch(82% 0.09 236); --on-accent: oklch(20% 0.03 250);
  --warn-ink: oklch(80% 0.13 65); --danger-ink: oklch(75% 0.14 25); --focus: oklch(80% 0.10 236);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.45;
  background:var(--bg-bot);
  background-image:radial-gradient(60% 40% at 85% -5%, var(--glow), transparent 70%),radial-gradient(50% 35% at -10% 30%, var(--glow), transparent 70%),linear-gradient(180deg,var(--bg-top),var(--bg-bot));
  background-attachment:fixed;min-height:100dvh;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5)}

.app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + var(--space-4)) var(--space-4) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 96px)}
.app.wide{max-width:980px}
.demo-note{font-size:12.5px;color:var(--ink-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-s);margin-bottom:var(--space-3);display:flex;gap:var(--space-2);align-items:flex-start}
.demo-note b{color:var(--accent-ink);font-weight:600;white-space:nowrap}

/* 大標題 */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-3);margin:var(--space-2) 0 var(--space-4)}
.lt h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:.01em;margin:0;min-width:0;overflow-wrap:anywhere}
.lt .sub{font-size:14px;color:var(--ink-2);margin-top:var(--space-1)}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent-ink);font-size:16px;padding:6px 0;margin-bottom:var(--space-1)}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;font-weight:500}
.pill.quiet{background:transparent;border:1px solid var(--hair);color:var(--ink-2)}

.card{border-radius:var(--radius-l);padding:var(--space-4) var(--space-5);margin-bottom:var(--space-3)}
.sec-h{font-size:13px;color:var(--ink-2);font-weight:500;margin:var(--space-5) var(--space-1) var(--space-2);letter-spacing:.02em}

/* 現在 */
.now .lbl{display:flex;align-items:center;gap:var(--space-2);font-size:13px;color:var(--accent-ink);font-weight:600}
.now .lbl .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.now .big{font-size:24px;font-weight:650;line-height:1.25;margin:var(--space-2) 0 var(--space-1);overflow-wrap:anywhere}
.now .meta{font-size:14px;color:var(--ink-2)}
.now .track{height:6px;border-radius:99px;background:var(--hair);margin-top:var(--space-3);overflow:hidden}
.now .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.now .then{margin-top:var(--space-3);padding-top:var(--space-3);border-top:1px solid var(--hair);font-size:14px;color:var(--ink-2);display:flex;gap:var(--space-2);align-items:baseline;min-width:0}
.now .then b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mini-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3);margin-bottom:var(--space-3)}
.mini{border-radius:var(--radius-m);padding:var(--space-3) var(--space-4);min-width:0;text-align:left;border:1px solid var(--glass-line)}
.mini .k{font-size:12px;color:var(--ink-2)}
.mini .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v small{font-size:13px;color:var(--ink-2);font-weight:400}
.mini .bar{height:4px;border-radius:99px;background:var(--hair);margin-top:var(--space-2);overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--accent)}
.mini.hot .v{color:var(--warn-ink)}
button.mini{cursor:pointer;transition:transform var(--dur-s) var(--ease-out)}
button.mini:active{transform:scale(.98)}

/* 時間軸 */
.tl{list-style:none;margin:0;padding:var(--space-2) 0;position:relative}
.tl::before{content:"";position:absolute;left:61px;top:22px;bottom:22px;width:2px;border-radius:2px;background:var(--hair)}
.tl li{display:grid;grid-template-columns:50px 24px minmax(0,1fr) 44px;align-items:start;column-gap:0;position:relative}
.tl time{font-size:14px;font-weight:600;text-align:right;padding-top:12px;padding-right:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.tl time small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:2px}
.tl .node{justify-self:center;margin-top:15px;width:12px;height:12px;border-radius:50%;background:var(--k);box-shadow:0 0 0 3px var(--bg-top);position:relative;z-index:1}
.tl .body{padding:10px 0 12px 8px;min-width:0}
.tl .ttl{font-size:16px;font-weight:500;overflow-wrap:anywhere}
.tl .meta{font-size:13px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.tl .meta .kk{color:var(--ink-3)}
.tl li.past .ttl,.tl li.past time{color:var(--ink-3)}
.tl li.past .node{opacity:.55}
.tl li.done .ttl{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}
.tl li.cur .node{width:16px;height:16px;margin-top:13px;background:var(--accent);box-shadow:0 0 0 3px var(--bg-top),0 0 0 6px var(--accent-soft)}
.tl li.cur .body{background:var(--accent-soft);border-radius:var(--radius-s);padding-left:10px;padding-right:8px;margin:4px 0}
.tl li.commute{grid-template-columns:50px 24px minmax(0,1fr)}
.tl li.commute .node{width:6px;height:6px;margin-top:10px;background:var(--k-commute)}
.tl li.commute .body{padding:4px 0 4px 8px;font-size:12.5px;color:var(--ink-3)}
.tl li.commute time{padding-top:4px;font-size:12px;font-weight:400;color:var(--ink-3)}
.tl li.nowline{grid-template-columns:50px 24px minmax(0,1fr)}
.tl li.nowline time{color:var(--accent-ink);padding-top:2px;font-size:12.5px}
.tl li.nowline .node{width:10px;height:10px;margin-top:5px;background:var(--accent-ink)}
.tl li.nowline .line{height:2px;background:var(--accent-ink);margin-top:9px;border-radius:2px;opacity:.6}
.k-admin{--k:var(--k-admin)}.k-due,.k-exam{--k:var(--k-due)}.k-read{--k:var(--k-read)}.k-focus{--k:var(--k-focus)}.k-appt{--k:var(--k-appt)}.k-class{--k:var(--k-class)}.k-routine{--k:var(--k-routine)}.k-commute{--k:var(--k-commute)}.k-other{--k:var(--k-other)}

/* 圓形勾 */
.chk{appearance:none;-webkit-appearance:none;margin:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:none;border:0;cursor:pointer;position:relative}
.chk::before{content:"";width:24px;height:24px;border-radius:50%;border:1.75px solid var(--ink-3);box-sizing:border-box;transition:background var(--dur-s) var(--ease-out),border-color var(--dur-s) var(--ease-out),transform var(--dur-s) var(--ease-out)}
.chk::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform var(--dur-s) var(--ease-out)}
.chk:hover::before{border-color:var(--accent-ink)}
.chk:active::before{transform:scale(.9)}
.chk:checked::before{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.chk:disabled{cursor:default;opacity:.4}
.chk:focus-visible{outline:none}
.chk:focus-visible::before{outline:2px solid var(--focus);outline-offset:2px}
.tl .chk{margin-top:0}

.empty{color:var(--ink-2);font-size:15px;padding:var(--space-6) var(--space-2);text-align:center}
.tomorrow{font-size:14px;color:var(--ink-2);padding:var(--space-3) var(--space-5);border-radius:var(--radius-m);display:flex;gap:var(--space-2);min-width:0}
.tomorrow b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* 本週：日期列 */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;border-radius:var(--radius-l);margin-bottom:var(--space-3)}
.strip button{border:0;background:none;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:background var(--dur-s) var(--ease-out)}
.strip .w{font-size:12px;color:var(--ink-2)}
.strip .d{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.strip .dots{display:flex;gap:2px;height:5px;align-items:center}
.strip .dots i{width:4px;height:4px;border-radius:50%;background:var(--k)}
.strip button.today .d{color:var(--accent-ink)}
.strip button[aria-selected="true"]{background:var(--accent)}
.strip button[aria-selected="true"] .w,.strip button[aria-selected="true"] .d{color:var(--on-accent)}
.strip button[aria-selected="true"] .dots i{background:var(--on-accent);opacity:.85}
.strip button:hover:not([aria-selected="true"]){background:var(--accent-soft)}
.strip button.past:not([aria-selected="true"]) .d{color:var(--ink-3)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 var(--space-1) var(--space-1)}
.day-h b{font-size:17px;font-weight:600}
.day-h span{font-size:13px;color:var(--ink-2)}

/* 月曆 */
.cal{display:grid;grid-template-columns:22px repeat(7,minmax(0,1fr));gap:4px;align-content:start}
.cal .wd{font-size:12px;color:var(--ink-2);text-align:center;padding:2px 0 4px}
.cal .wd.we{color:var(--ink-3)}
.cal .wk{font-size:10px;color:var(--ink-3);writing-mode:vertical-rl;text-align:center;align-self:center;letter-spacing:.06em}
.cal .wk.exam{color:var(--warn-ink);font-weight:600}
.cell{min-width:0;min-height:96px;border-radius:12px;padding:5px 4px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;cursor:pointer;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform var(--dur-s) var(--ease-out)}
.cell:active{transform:scale(.97)}
.cell .dn{display:flex;justify-content:space-between;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.cell .dn b{font-size:13px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell .dn .m{font-size:10px;color:var(--accent-ink);font-weight:600}
.cell .dn .h{font-size:10px;color:var(--ink-3)}
.cell.today .dn b{background:var(--accent);color:var(--on-accent)}
.cell.past{opacity:.55}
.cell.we{background:color-mix(in oklch, var(--glass) 70%, transparent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-1px}
.cchip{display:flex;gap:3px;align-items:flex-start;font-size:11px;line-height:1.25;min-width:0}
.cchip::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--k);margin-top:4px}
.cchip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-width:0}
.cchip.allday span{font-weight:600}
.cchip.done span{text-decoration:line-through;color:var(--ink-3)}
.cell .more{font-size:10px;color:var(--ink-3)}
.cell .load{position:absolute;left:5px;right:5px;bottom:4px;height:3px;border-radius:2px;background:var(--hair);overflow:hidden;display:flex}
.cell .load i{display:block;height:100%;background:var(--k)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-4);align-items:center}
.filters .lbl{font-size:12px;color:var(--ink-2);margin-right:2px}
.f{border:1px solid var(--hair);background:var(--glass);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:34px;white-space:nowrap;transition:background var(--dur-s) var(--ease-out)}
.f::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.f.plain::before{display:none}
.f[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.f[aria-pressed="true"]::before{box-shadow:0 0 0 1.5px var(--on-accent)}
.f:hover:not([aria-pressed="true"]){background:var(--accent-soft)}
.fhint{font-size:12.5px;color:var(--ink-2);margin:var(--space-2) var(--space-1) 0}
.mstamp{display:flex;gap:var(--space-2);align-items:center;font-size:12.5px;color:var(--ink-2)}
.tbtn{border:0;background:none;color:var(--accent-ink);font-size:14px;padding:8px 4px;font-weight:500}
.tbtn:hover{text-decoration:underline}
.tbtn:disabled{color:var(--ink-3);text-decoration:none}
.banner{border-radius:var(--radius-m);padding:var(--space-3) var(--space-4);font-size:14px;margin-bottom:var(--space-3);color:var(--warn-ink)}

/* 截止日 */
.group{border-radius:var(--radius-l);overflow:hidden;padding:0}
.dl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:4px;padding:6px var(--space-4) 6px 6px;position:relative}
.dl + .dl::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--hair)}
.dl .main{min-width:0;padding:8px 0;border:0;background:none;text-align:left}
.dl .ttl{font-size:16px;font-weight:500;display:flex;gap:6px;align-items:center;min-width:0}
.dl .ttl::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--k)}
.dl .ttl span{overflow-wrap:anywhere;min-width:0}
.dl .when{font-size:13px;color:var(--ink-2);margin-top:2px;padding-left:13px}
.dl .note{font-size:13px;color:var(--ink-2);margin-top:var(--space-2);padding-left:13px;overflow-wrap:anywhere}
.dl .left{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl .left b{font-size:22px;font-weight:650;letter-spacing:-.01em}
.dl .left small{font-size:12px;color:var(--ink-2);margin-left:2px}
.dl .left.hot b{color:var(--warn-ink)}
.dl .left.over b{color:var(--danger-ink);font-size:15px}
.dl .left.tod b{color:var(--warn-ink);font-size:17px}
.dl.done .ttl span{text-decoration:line-through;color:var(--ink-3)}
.dl.done .left b{font-size:14px;color:var(--ink-3);font-weight:500}
.dl .acts{display:flex;gap:var(--space-3);padding-left:13px;margin-top:var(--space-2)}
.del{border:0;background:none;color:var(--danger-ink);font-size:14px;padding:6px 0}
.del.armed{font-weight:600}
details.more-done{margin-top:var(--space-3)}
details.more-done>summary{list-style:none;cursor:pointer;font-size:14px;color:var(--ink-2);padding:var(--space-2) var(--space-1);display:flex;gap:6px;align-items:center}
details.more-done>summary::-webkit-details-marker{display:none}
details.more-done>summary::before{content:"›";display:inline-block;transition:transform var(--dur-s) var(--ease-out)}
details.more-done[open]>summary::before{transform:rotate(90deg)}

/* 更多（iOS 分組清單） */
.rows{border-radius:var(--radius-l);overflow:hidden}
.rowlink{display:flex;align-items:center;gap:var(--space-3);width:100%;border:0;background:none;padding:14px var(--space-4);text-align:left;position:relative;min-height:56px}
.rowlink + .rowlink::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--hair)}
.rowlink .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.rowlink .ic svg{width:18px;height:18px}
.rowlink .tx{flex:1;min-width:0}
.rowlink .tx b{display:block;font-weight:500;font-size:16px}
.rowlink .tx small{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlink .chev{color:var(--ink-3);font-size:20px}
.rowlink .badge{font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 8px}

.course .meta{font-size:13px;color:var(--ink-2);margin-top:2px}

.ann{margin-top:var(--space-3);font-size:13.5px;background:var(--accent-soft);border-radius:var(--radius-s);padding:var(--space-2) var(--space-3)}

.rt .nx{font-size:13px;color:var(--accent-ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

.tabbar .tb-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabbar-h)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:500;min-width:0;transition:color var(--dur-s) var(--ease-out)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent-ink)}

.tabbar .dot{position:absolute;margin:-18px 0 0 22px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

/* 浮動＋ */
.fab{position:fixed;z-index:21;right:max(var(--space-4), calc((100vw - 680px)/2 + var(--space-4)));bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--space-4));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px oklch(60% 0.08 240 / .22);border:1px solid var(--glass-line);transition:transform var(--dur-s) var(--ease-out)}

.iconbtn:hover{color:var(--ink)}
.iconbtn:disabled{opacity:.35}
.sp{display:flex;gap:var(--space-2)}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);transform:translate(-50%,-50%);border-radius:var(--radius-l);border-bottom:1px solid var(--glass-line);max-height:80dvh}
  .sheet .grab{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sheetUp var(--dur-m) var(--ease-out)}
  .scrim{animation:fade var(--dur-m) var(--ease-out)}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:.3}}
  @keyframes fade{from{opacity:0}}
  @media (min-width:760px){ .sheet{animation:fade var(--dur-m) var(--ease-out)} }
  .view{animation:fade var(--dur-m) var(--ease-out)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important}}

/* 分段控制＋表單 */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--hair);margin-bottom:var(--space-4)}

textarea.in{min-height:110px;resize:vertical}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-3)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-4)}
.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;min-height:50px;transition:transform var(--dur-s) var(--ease-out),opacity var(--dur-s)}
.btn:hover{filter:brightness(1.03)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn[data-state="loading"]{opacity:.7}
.hint{font-size:13px;color:var(--ink-2);margin-top:var(--space-2)}
.hint.ok{color:var(--accent-ink)}
.hint.err{color:var(--danger-ink)}
.msgs{margin-top:var(--space-5)}
.msg{font-size:14px;padding:10px 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3)}
.msg small{display:block;color:var(--ink-3);font-size:12px}
.msg .st{font-size:12px;color:var(--ink-2);white-space:nowrap}
.msg .st.wait{color:var(--accent-ink);font-weight:600}
.ev{display:grid;grid-template-columns:76px minmax(0,1fr);gap:var(--space-3);padding:10px 0;border-top:1px solid var(--hair)}
.ev:first-child{border-top:0}
.ev time{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.ev time::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--k);transform:translateY(-1px)}
.ev .t{min-width:0;font-size:15px;overflow-wrap:anywhere}
.ev .t small{display:block;font-size:12.5px;color:var(--ink-2);white-space:pre-line}

</style>
</head>

const state = {settings:null, weeks:[], deadlines:[], recurring:[], courses:[], inbox:[]};

function lang(){ if(langOverride) return langOverride; const l=String((state.settings&&state.settings.language)||"zh").toLowerCase(); return l.startsWith("en")?"en":"zh"; }

// ---------- 時間：一律用 settings.timezone（IANA），自動處理夏令時間；tp() 的 getUTC* 就是當地時間 ----------
let _fmt=null,_fmtTz=null;
function tzFormatter(){ const tz=state.settings&&state.settings.timezone; if(!tz) return null; if(_fmtTz===tz) return _fmt; _fmtTz=tz;
  try{ _fmt=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}); }catch(e){ _fmt=null; } return _fmt; }
function tp(ms){ ms=ms??Date.now(); const f=tzFormatter();
  if(f){ const p={}; f.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value); return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)); }
  const h=state.settings&&typeof state.settings.tzOffsetHours==="number"?state.settings.tzOffsetHours:8; return new Date(ms+h*3600000); }
function tzOffsetStr(dateStr){ // 那一天中午的時差，例如 +08:00
  const [y,m,d]=dateStr.split("-").map(Number); const utc=Date.UTC(y,m-1,d,12); const off=Math.round((tp(utc)-utc)/60000);
  const sg=off<0?"-":"+", a=Math.abs(off); return sg+pad(Math.floor(a/60))+":"+pad(a%60); }
const pad=n=>String(n).padStart(2,"0");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function ymd(d){return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function todayStr(){return ymd(tp());}
function nowMin(){const n=tp();return n.getUTCHours()*60+n.getUTCMinutes();}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));}
function add(s,n){const d=pd(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d);}
function wday(s){return pd(s).getUTCDay();}
function md(s){const d=pd(s);return (d.getUTCMonth()+1)+"/"+d.getUTCDate();}
function mdw(s){const d=pd(s);return L().mdw(d.getUTCMonth()+1,d.getUTCDate(),L().wd[d.getUTCDay()]);}
function wdName(s){return L().dayName(L().wd[wday(s)]);}
function daysUntil(s){return Math.round((pd(s)-pd(todayStr()))/864e5);}
function toMin(t){if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m;}
function dur(it){const a=toMin(it.start),b=toMin(it.end);return a!=null&&b!=null&&b>a?b-a:0;}
function hrs(m){return Math.round(m/30)/2;}
function hhmm(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
function normT(t){return String(t||"").replace(/^[🔴✅🚗☕\s]+/u,"").replace(/\s+/g,"");}
function fmtAt(iso){const t=Date.parse(iso);if(isNaN(t))return "";const d=tp(t);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()+" "+pad(d.getUTCHours())+":"+pad(d.getUTCMinutes());}
function fail(msg){ const c=$("#conn"); c.textContent=msg; c.hidden=false; clearTimeout(fail.t); fail.t=setTimeout(()=>{c.hidden=true;},8000); }
function recent(s){return s && daysUntil(s)>=-14;}

// 學期週次：從 settings.semesterStart 起算，每 7 天換一週；沒設定就不顯示
function semInfo(s){ const st=state.settings||{}; if(!st.semesterStart) return null; const n=Math.floor((pd(s)-pd(st.semesterStart))/864e5/7)+1; const total=st.semesterWeeks||18; if(n<1||n>total) return null;
  return {n,total,tag:(st.midtermWeeks||[]).includes(n)?"mid":(st.finalWeeks||[]).includes(n)?"fin":""}; }
function semLabel(s){ const x=semInfo(s); if(!x) return ""; const t=L(); return t.semWeek(x.n)+(x.tag==="mid"?t.midterm:x.tag==="fin"?t.finals:""); }

function currentWeek(){ const today=todayStr(); const sorted=[...state.weeks].sort((a,b)=>a.weekStart<b.weekStart?-1:1);
  let pick=null; for(const w of sorted){ if(w.weekStart<=today) pick=w; }
  const cur=pick&&(!pick.weekEnd||pick.weekEnd>=today)?pick:null; return cur||sorted.find(w=>w.weekStart>today)||pick; }
function weekOf(date){return state.weeks.find(w=>w.weekStart<=date&&(w.weekEnd||add(w.weekStart,6))>=date)||null;}
function itemsOn(date){ const w=weekOf(date); if(!w) return {w:null,list:[]};
  return {w,list:(w.items||[]).map((it,i)=>({...it,_i:i})).filter(it=>it.date===date).sort((a,b)=>a.start<b.start?-1:1)}; }
const checkable=it=>!["class","commute"].includes(it.kind);
const commuteText=it=>String(it.title||"").replace(/^[🚗\s]+/u,"");

// ---------- 時間軸 ----------
function tlHTML(w,list,date,{showNow}={}){
  const t=L(), today=todayStr(), nm=nowMin();
  if(!got.has("weeks")) return `<li style="display:block"><div class="empty">${esc(db===false?t.noView:t.loading)}</div></li>`;
  if(!list.length) return `<li style="display:block"><div class="empty">${esc(t.emptyDay)}</div></li>`;
  let h="", placed=!showNow;
  for(const it of list){
    const s=toMin(it.start), e=toMin(it.end)??s;
    if(!placed&&s!=null&&s>nm){ h+=nowLine(nm); placed=true; }
    const past=date<today||(date===today&&e<=nm), cur=date===today&&s<=nm&&e>nm;
    if(it.kind==="commute"){ const ct=commuteText(it); h+=`<li class="commute k-commute"><time>${esc(it.start)}</time><span class="node"></span><div class="body">🚗 ${dur(it)?t.hm(dur(it)):""}${ct?"・"+esc(ct):""}</div></li>`; continue; }
    if(cur) placed=true;
    const meta=[`<span class="kk">${esc(t.kind[it.kind]||"")}</span>`,dur(it)?t.hm(dur(it)):"",cur?t.left(e-nm):"",it.note?esc(it.note):""].filter(Boolean).join("・");
    h+=`<li class="k-${esc(it.kind)}${past?" past":""}${it.done?" done":""}${cur?" cur":""}"><time>${esc(it.start)}${it.end?`<small>${esc(it.end)}</small>`:""}</time><span class="node"></span><div class="body"><div class="ttl">${esc(it.title)}</div><div class="meta">${meta}</div></div>${checkable(it)?`<input type="checkbox" class="chk" data-w="${esc(w._id)}" data-i="${it._i}" ${it.done?"checked":""} aria-label="${esc(t.doneLabel+it.title)}">`:"<span></span>"}</li>`;
  }
  if(!placed) h+=nowLine(nm);
  return h;
}
function nowLine(nm){return `<li class="nowline" aria-label="${esc(L().now)} ${hhmm(nm)}"><time>${hhmm(nm)}</time><span class="node"></span><div class="line"></div></li>`;}
function wireChecks(root){
  root.querySelectorAll("input.chk[data-w]").forEach(cb=>cb.addEventListener("change",async()=>{
    if(!db){cb.checked=!cb.checked;return;}
    const w=state.weeks.find(x=>x._id===cb.dataset.w); if(!w) return;
    const items=(w.items||[]).map(x=>({...x})); const it=items[+cb.dataset.i]; it.done=cb.checked;
    try{ await db.doc("weeks/"+w._id).update({items}); }catch(e){ cb.checked=!cb.checked; fail(L().saveFail); return; }
    // 連到的截止日一起改：dls 連結，或標題完全相同
    const ids=new Set(it.dls||[]); state.deadlines.forEach(d=>{ if(normT(d.title)===normT(it.title)) ids.add(d._id); });
    for(const id of ids){ const d=state.deadlines.find(x=>x._id===id); if(!d||!!d.done===cb.checked) continue;
      try{ await db.doc("deadlines/"+id).update({done:cb.checked}); }catch(e){ fail(L().dlSyncFail); } }
  }));
}
async function syncWeekItems(id,done){
  const d=state.deadlines.find(x=>x._id===id);
  for(const w of state.weeks){ let changed=false;
    const items=(w.items||[]).map(x=>{ const y={...x}; const hit=(y.dls||[]).includes(id)||(d&&normT(d.title)===normT(y.title));
      if(hit&&!!y.done!==done){ if(done&&(y.dls||[]).length>1&&!y.dls.every(k=>k===id||(state.deadlines.find(z=>z._id===k)||{}).done)) return y; y.done=done; changed=true; }
      return y; });
    if(changed){ try{ await db.doc("weeks/"+w._id).update({items}); }catch(e){ fail(L().wkSyncFail); } } }
}
async function unlinkDeadline(id){
  for(const w of state.weeks){ if(!(w.items||[]).some(x=>(x.dls||[]).includes(id))) continue;
    const items=w.items.map(x=>{ if(!(x.dls||[]).includes(id)) return x; const y={...x}; y.dls=y.dls.filter(k=>k!==id); if(!y.dls.length) delete y.dls; return y; });
    await db.doc("weeks/"+w._id).update({items}); }
}

// ---------- 今天 ----------
function upcomingDeadline(){ const today=todayStr();
  return [...state.deadlines].filter(d=>!d.done&&d.date>=today&&["due","exam","admin"].includes(d.cat)).sort((a,b)=>(a.date+(a.time||"99"))<(b.date+(b.time||"99"))?-1:1)[0]||null; }
function nextAfterToday(){ const today=todayStr();
  return state.weeks.flatMap(w=>w.items||[]).filter(it=>it.date>today&&it.kind!=="commute"&&!it.done).sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1)[0]||null; }
function renderToday(){
  const t=L(), today=todayStr(), nm=nowMin(); const sl=semLabel(today);
  $("#todaySub").textContent=mdw(today)+(sl?(lang()==="en"?" · ":"・")+sl:"");
  $("#clock").textContent=hhmm(nm);
  const {w,list}=itemsOn(today); const real=list.filter(it=>it.kind!=="commute");
  const cur=real.find(it=>toMin(it.start)<=nm&&(toMin(it.end)??toMin(it.start))>nm);

  else if(cur){ const s=toMin(cur.start), e=toMin(cur.end)??s, p=Math.round((nm-s)/Math.max(1,e-s)*100);
    h+=`<div class="big">${esc(cur.title)}</div><div class="meta num">${esc(cur.start)}–${esc(cur.end)}・${esc(t.left(e-nm))}${cur.note?"・"+esc(cur.note):""}</div><div class="track" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(t.pct(p))}"><i style="width:${p}%"></i></div>`; }
  else{ h+=`<div class="big">${esc(t.free)}</div>`; if(next) h+=`<div class="meta">${esc(next.date===today?t.nextIn(t.hm(toMin(next.start)-nm)):t.nothingElse)}</div>`; }
  if(next&&got.has("weeks")) h+=`<div class="then"><span class="num">${next.date===today?"":esc(md(next.date))+" "}${esc(next.start)}</span><b>${esc(next.title)}</b></div>`;
  $("#nowCard").innerHTML=h+`</div>`;
  const ck=real.filter(checkable), dn=ck.filter(it=>it.done).length; const dl=upcomingDeadline(), n=dl?daysUntil(dl.date):null;
  $("#miniRow").innerHTML=`<div class="mini glass"><div class="k">${esc(t.progress)}</div><div class="v num">${dn} / ${ck.length} <small>${esc(t.doneUnit)}</small></div><div class="bar"><i style="width:${ck.length?Math.round(dn/ck.length*100):0}%"></i></div></div>`+
    (dl?`<button type="button" class="mini glass${n<=7?" hot":""}" id="toDue"><div class="k">${esc(t.nextDue(n))}</div><div class="v">${esc(dl.title)}</div></button>`:`<div class="mini glass"><div class="k">${esc(t.nextDueNone)}</div><div class="v">${esc(t.none)}</div></div>`);
  const td=$("#toDue"); if(td) td.addEventListener("click",()=>showTab("due"));
  $("#todayTl").innerHTML=tlHTML(w,list,today,{showNow:true}); wireChecks($("#todayTl"));

  $("#tomorrow").innerHTML=t2.length?`<span>${esc(t.tomorrow(t2.length,t2[0].start))}</span><b>${esc(t2[0].title)}</b>`:`<span>${esc(t.tomorrowNone)}</span>`;

// ---------- 本週 ----------
let selDay=null;
function renderWeek(){
  const t=L(), w=currentWeek(), today=todayStr();
  if(!w){ $("#strip").innerHTML=""; $("#weekSub").textContent=""; $("#weekStatus").textContent=""; $("#dayTitle").textContent=""; $("#dayMeta").textContent="";
    $("#weekTl").innerHTML=got.has("weeks")?`<li style="display:block"><div class="empty">${esc(t.noWeek)}</div></li>`:tlHTML(null,[],today); return; }
  const start=w.weekStart, end=w.weekEnd||add(start,6);
  if(!selDay||selDay<start||selDay>end) selDay=today>=start&&today<=end?today:start;
  $("#weekSub").textContent=md(start)+" – "+md(end); $("#weekStatus").textContent=t.st[w.status]||"";
  const days=[]; for(let d=start; d<=end; d=add(d,1)) days.push(d);
  $("#strip").style.gridTemplateColumns=`repeat(${days.length},minmax(0,1fr))`;
  $("#strip").innerHTML=days.map(d=>{ const l=(w.items||[]).filter(it=>it.date===d&&it.kind!=="commute"); const kinds=[...new Set(l.map(it=>it.kind))].slice(0,4);
    return `<button type="button" role="tab" data-d="${d}" aria-selected="${d===selDay}" class="${d===today?"today":""}${d<today?" past":""}" aria-label="${esc(t.dayAria(mdw(d),l.length))}"><span class="w">${esc(t.wd[wday(d)])}</span><span class="d">${pd(d).getUTCDate()}</span><span class="dots">${kinds.map(k=>`<i class="k-${esc(k)}"></i>`).join("")}</span></button>`; }).join("");

let mStart=null, mDays=[], mEnd=null;
function setMonthRange(){ const td=todayStr(); mStart=add(td,-wday(td)); mDays=[...Array(WEEKS*7)].map((_,i)=>add(mStart,i)); mEnd=add(mStart,WEEKS*7); }
const weekData=new Array(WEEKS).fill(null);
let mSource="page", filter=null, openDay=null, showAll=false, lastStamp=null;
try{const f=JSON.parse(localStorage.getItem("mv-filter")||"null"); if(Array.isArray(f)&&f.length) filter=new Set(f.filter(k=>KINDS.includes(k)));}catch(e){}
function clean(t){return String(t||"").replace(/^(✅\s*)/u,"").replace(/^[🔴🚗☕🔋📝\s]+/u,"").trim();}
function normCal(ev){
  const s=ev.start||{}, e=ev.end||{}, allDay=!!s.date&&!s.dateTime, title=ev.summary||"—", done=/^✅/u.test(title);
  let kind=CKIND[ev.colorId]||"other"; if(kind==="class"&&/🚗/u.test(title)) kind="commute"; const desc=String(ev.description||"");
  if(allDay){ const isDue=desc.includes("[截止日]")||desc.includes("[Deadline]")||kind==="admin"||kind==="due"; if(kind==="other"&&isDue) kind="due";
    const sd=String(s.date).slice(0,10), ed=String(e.date||s.date).slice(0,10); return {allDay:true,sd,ed:ed>sd?ed:add(sd,1),clean:clean(title),done,kind,isDue,desc,id:ev.id}; }
  const st=tp(Date.parse(s.dateTime)), en=tp(Date.parse(e.dateTime||s.dateTime));
  return {allDay:false,date:ymd(st),start:pad(st.getUTCHours())+":"+pad(st.getUTCMinutes()),end:pad(en.getUTCHours())+":"+pad(en.getUTCMinutes()),mins:Math.max(0,(en-st)/6e4),clean:clean(title),done,kind,desc,id:ev.id};
}
function pageEvents(){ // 頁面資料轉成和日曆一樣的格式
  const out=[];
  state.weeks.forEach(w=>(w.items||[]).forEach((it,i)=>out.push({allDay:false,date:it.date,start:it.start,end:it.end||it.start,mins:dur(it),clean:it.kind==="commute"?commuteText(it):clean(it.title),done:!!it.done,kind:it.kind==="exam"?"due":(KINDS.includes(it.kind)?it.kind:"other"),desc:it.note||"",id:w._id+i})));
  state.deadlines.forEach(d=>out.push({allDay:true,sd:d.date,ed:add(d.date,1),clean:d.title,done:!!d.done,kind:d.cat==="exam"?"due":(KINDS.includes(d.cat)?d.cat:"due"),isDue:true,desc:[d.time,d.note].filter(Boolean).join("・"),id:"dl"+d._id}));
  return out;
}
function eventsByDay(){
  const map={}; mDays.forEach(d=>map[d]={timed:[],allDay:[]}); const seen=new Set();
  const list=mSource==="google"?weekData.flatMap(l=>(l||[]).filter(r=>r.status!=="cancelled").map(normCal)):pageEvents();
  list.forEach(ev=>{ if(ev.allDay){ for(let d=ev.sd; d<ev.ed; d=add(d,1)){ if(map[d]&&!seen.has(ev.id+d)){seen.add(ev.id+d);map[d].allDay.push(ev);} } }
    else if(map[ev.date]&&!seen.has(ev.id)){seen.add(ev.id);map[ev.date].timed.push(ev);} });
  Object.values(map).forEach(v=>v.timed.sort((a,b)=>a.start<b.start?-1:1)); return map;
}
function matches(e){ if(!filter) return e.allDay?(e.isDue||e.kind!=="other"):KEY_KINDS.includes(e.kind); return filter.has(e.kind); }
function descText(d){return d.replace(/\[Claude安排\]|\[截止日\]|\[Planned by Claude\]|\[Deadline\]/g,"").replace(/<[^>]+>/g," ").trim();}
function loadedDay(d){ return mSource!=="google"||!!weekData[Math.floor((pd(d)-pd(mStart))/864e5/7)]; }
function renderMonth(){
  if(!mStart) setMonthRange();
  const t=L(), map=eventsByDay(), td=todayStr();
  $("#mRange").textContent=md(mStart)+" – "+md(add(mEnd,-1))+t.weeks5;
  if(mSource!=="google"){ $("#mStamp").textContent=t.fromPage; $("#mRefresh").hidden=true; }
  let h='<div></div>'+t.wd.map((w,i)=>`<div class="wd${i===0||i===6?" we":""}">${esc(w)}</div>`).join("");
  for(let w=0;w<WEEKS;w++){
    const si=semInfo(mDays[w*7]);
    h+=`<div class="wk${si&&si.tag?" exam":""}">${si?"W"+si.n:""}</div>`;
    for(let i=0;i<7;i++){
      const d=mDays[w*7+i], v=map[d], dt=pd(d); const shown=[...v.allDay,...v.timed].filter(matches);
      const lines=shown.slice(0,2).map(e=>`<span class="cchip k-${e.kind}${e.allDay?" allday":""}${e.done?" done":""}"><span>${esc(e.clean)}</span></span>`).join("");
      const rest=shown.length-2, parts={}; let tot=0;
      v.timed.forEach(e=>{ if(filter?!filter.has(e.kind):e.kind==="commute") return; parts[e.kind]=(parts[e.kind]||0)+e.mins; tot+=e.mins; });
      const bar=Object.entries(parts).map(([k,m])=>`<i class="k-${k}" style="width:${Math.min(100,m/600*100)}%"></i>`).join("");
      const first=dt.getUTCDate()===1;
      const cls=["cell",(i===0||i===6)?"we":"",d<td?"past":"",d===td?"today":"",d===openDay?"sel":""].filter(Boolean).join(" ");
      h+=`<button type="button" class="${cls}" data-d="${d}" aria-label="${esc(t.cellAria(mdw(d),v.timed.length+v.allDay.length))}"><span class="dn"><b>${dt.getUTCDate()}</b>${first?`<span class="m">${lang()==="en"?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getUTCMonth()]:(dt.getUTCMonth()+1)+"月"}</span>`:(tot?`<span class="h">${hrs(tot)}h</span>`:"")}</span>${lines}${rest>0?`<span class="more">＋${rest}</span>`:""}<span class="load">${bar}</span></button>`;
    }
  }
  $("#cal").innerHTML=h;
  $("#cal").querySelectorAll(".cell").forEach(c=>c.addEventListener("click",()=>{openDay=c.dataset.d;showAll=false;openSheet("day",c);}));
  const key=!filter, all=filter&&filter.size===KINDS.length;
  $("#filters").innerHTML=`<span class="lbl">${esc(t.show)}</span><button type="button" class="f plain" data-f="key" aria-pressed="${key}">${esc(t.fKey)}</button><button type="button" class="f plain" data-f="all" aria-pressed="${!!all}">${esc(t.fAll)}</button>`+KINDS.map(k=>`<button type="button" class="f k-${k}" data-f="${k}" aria-pressed="${!!(filter&&filter.has(k)&&!all)}">${esc(t.kind[k])}</button>`).join("");
  $("#fhint").textContent=key?t.hintKey:all?t.hintAll:t.hintSome([...filter].map(k=>t.kind[k]).join(t.listSep));
  $("#filters").querySelectorAll(".f").forEach(b=>b.addEventListener("click",()=>{ const f=b.dataset.f;
    if(f==="key") filter=null; else if(f==="all") filter=new Set(KINDS);
    else{ if(!filter||filter.size===KINDS.length) filter=new Set([f]); else if(filter.has(f)){filter.delete(f); if(!filter.size) filter=null;} else filter.add(f); }
    try{localStorage.setItem("mv-filter",JSON.stringify(filter?[...filter]:null));}catch(e){} renderMonth(); }));
  if(sheetMode==="day") renderDaySheet(map);
}
function renderDaySheet(map){
  map=map||eventsByDay(); if(!openDay) return; const t=L(), v=map[openDay]; if(!v) return;
  $("#sTitle").textContent=mdw(openDay)+(openDay===todayStr()?(lang()==="en"?" · ":"・")+t.todayWord:"");
  const tot=v.timed.filter(e=>e.kind!=="commute").reduce((s,e)=>s+e.mins,0); const sl=semLabel(openDay);
  $("#sSub").textContent=[sl,tot?t.planned(hrs(tot)):""].filter(Boolean).join(lang()==="en"?" · ":"・");
  $("#sTools").innerHTML=`<button type="button" class="iconbtn" id="sPrev" aria-label="${esc(t.prevDay)}" ${openDay<=mStart?"disabled":""}>‹</button><button type="button" class="iconbtn" id="sNext" aria-label="${esc(t.nextDay)}" ${openDay>=add(mEnd,-1)?"disabled":""}>›</button>`+closeBtn();
  $("#sClose").addEventListener("click",closeSheet);
  $("#sPrev").addEventListener("click",()=>{openDay=add(openDay,-1);showAll=false;renderMonth();});
  $("#sNext").addEventListener("click",()=>{openDay=add(openDay,1);showAll=false;renderMonth();});
  const body=$("#sBody");
  if(!loadedDay(openDay)){ body.innerHTML=`<div class="empty">${esc(t.loading)}</div>`; return; }
  const all=[...v.allDay,...v.timed], filtering=!!filter&&filter.size!==KINDS.length&&!showAll; const list=filtering?all.filter(matches):all, hidden=all.length-list.length;
  body.innerHTML=(list.length?list.map(e=>{const dsc=descText(e.desc);return `<div class="ev k-${e.kind}${e.done?" done":""}${e.kind==="commute"?" commute":""}"><time>${e.allDay?esc(t.allDay):esc(e.start)}</time><div class="t"><span>${esc(e.clean)}</span><span class="kk">${esc(t.kind[e.kind])}${e.allDay?"":" "+esc(e.start)+"–"+esc(e.end)}</span>${dsc&&e.kind!=="commute"?`<small>${esc(dsc)}</small>`:""}</div></div>`;}).join(""):`<div class="empty">${esc(all.length?t.noMatch:t.emptyDay)}</div>`)
    +(filtering&&hidden?`<div class="hidden-note">${esc(t.hiddenN(hidden))}<button class="tbtn" type="button" id="showAll">${esc(t.showAllDay)}</button></div>`:"")
    +(showAll&&filter&&filter.size!==KINDS.length?`<div class="hidden-note"><button class="tbtn" type="button" id="showF">${esc(t.showFiltered)}</button></div>`:"");
  const sa=$("#showAll"); if(sa) sa.addEventListener("click",()=>{showAll=true;renderDaySheet();});
  const sf=$("#showF"); if(sf) sf.addEventListener("click",()=>{showAll=false;renderDaySheet();});
}
(()=>{let x=null;const s=$("#sheet");
  s.addEventListener("touchstart",e=>{x=e.touches[0].clientX;},{passive:true});
  s.addEventListener("touchend",e=>{ if(x==null||sheetMode!=="day") return; const dx=e.changedTouches[0].clientX-x; x=null; if(Math.abs(dx)>60){const b=$(dx<0?"#sNext":"#sPrev"); if(b&&!b.disabled) b.click();} },{passive:true});})();
function mError(code){ const m=L().mErr; $("#mBanner").textContent=m[code]||m.other; $("#mBanner").hidden=false;
  if(["server_not_connected","server_not_found","not_in_manifest","blocked_by_policy","approval_required","no_mcp"].includes(code)){ mSource="page"; renderMonth(); } }
function mStampAt(ms){ lastStamp=Math.max(lastStamp||0,ms); const d=tp(lastStamp); $("#mStamp").textContent=L().updatedAt(pad(d.getUTCHours())+":"+pad(d.getUTCMinutes())); }
let mcpRef=null, mStarted=false;
async function startMonth(){
  setMonthRange();
  const cal=(state.settings&&state.settings.calendar)||{};
  if(DEMO||cal.type!=="google"||mStarted){ renderMonth(); return; }
  mStarted=true; mSource="google"; $("#mStamp").textContent=L().loading; $("#mRefresh").hidden=false;
  const mcp=window.claude?await window.claude.use("mcp").catch(()=>null):null;
  if(!mcp){ mError("no_mcp"); return; }
  mcpRef=mcp;
  for(let w=0;w<WEEKS;w++){
    const d0=mDays[w*7], d1=add(d0,7);
    const input={startTime:d0+"T00:00:00"+tzOffsetStr(d0),endTime:d1+"T00:00:00"+tzOffsetStr(d1),pageSize:250,orderBy:"startTime"};
    if(state.settings.timezone) input.timeZone=state.settings.timezone;
    if(cal.calendarId) input.calendarId=cal.calendarId;
    let retried=false;
    mcp.watchTool(SERVER,TOOL,input,ev=>{
      if(ev.type==="data"){ const p=ev.result.payload||{}; weekData[w]=Array.isArray(p.events)?p.events:[]; if(mSource==="google") $("#mBanner").hidden=true; mStampAt(ev.result.cache?ev.result.cache.storedAt:Date.now()); renderMonth(); }
      else{ const e=ev.error||{}, code=e.code||"upstream_error"; mError(code);
        if(e.retryable&&!retried){retried=true; setTimeout(()=>mcp.invalidate(SERVER,TOOL,input).catch(()=>{}),(e.retryAfterMs||3000)+Math.random()*2000);} }
    },{cache:{staleTime:60000},refetchInterval:300000});
  }
}
$("#mRefresh").addEventListener("click",async()=>{ if(!mcpRef) return; $("#mStamp").textContent=L().updating; try{await mcpRef.invalidate(SERVER,TOOL);}catch(e){} });

// ---------- 分頁 ----------
let curTab="today";
function showTab(name){
  curTab=name;
  document.querySelectorAll(".tabbar button").forEach(b=>{ if(b.dataset.tab===name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.querySelectorAll("[data-view]").forEach(v=>v.hidden=v.dataset.view!==name);
  $("#app").classList.toggle("wide",name==="month");
  if(name==="month") startMonth();
  if(name==="more"){ moreSub=null; renderMore(); }
  try{localStorage.setItem("v2-tab",name);}catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));

function renderAll(){ applyI18n(); renderToday(); renderWeek(); renderDue(); if(curTab==="more") renderMore(); if(curTab==="month") renderMonth(); if(sheetMode==="add") refreshMsgs(); }

// ---------- 範例模式：頁面裡定義了 window.PLANNER_DEMO 時，用記憶體裡的虛構資料 ----------
function memDb(data){
  const ls={}; const snap=c=>({docs:(data[c]||[]).map(d=>({id:d._id,data:()=>({...d})}))}); const fire=c=>(ls[c]||[]).forEach(f=>f(snap(c)));
  return { collection:c=>({ onSnapshot:f=>{(ls[c] ||= []).push(f); f(snap(c));}, add:async o=>{(data[c] ||= []).push({...o,_id:"d"+Date.now()}); fire(c);} }),
    doc:p=>{ const [c,id]=p.split("/"); if(c==="settings") return {onSnapshot:f=>f({exists:true,data:()=>data.settings})};
      return { update:async patch=>{const d=(data[c]||[]).find(x=>x._id===id); if(d){Object.assign(d,patch); fire(c);}}, delete:async()=>{data[c]=(data[c]||[]).filter(x=>x._id!==id); fire(c);} }; } };
}
function demoHelpers(){ const t=pd(todayStr()); const mon=new Date(t); mon.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));
  const day=n=>{const d=new Date(mon); d.setUTCDate(mon.getUTCDate()+n); return ymd(d);}; return {day,today:todayStr()}; }

renderAll();
(async()=>{
  if(typeof window.PLANNER_DEMO==="function"){
    DEMO=true; const data=window.PLANNER_DEMO(demoHelpers()); db=memDb(data);
    $("#demoBar").hidden=false;
    $("#langBtn").addEventListener("click",()=>{ langOverride=lang()==="en"?"zh":"en"; renderAll(); });
    db.doc("settings/main").onSnapshot(s=>{state.settings=s.data();});
  }else{
    $("#langBtn").hidden=true;
    const c=window.claude?await window.claude.use("db").catch(()=>null):null;
    if(!c){ db=false; renderAll(); fail(L().noView); return; }
    db=c;
    db.doc("settings/main").onSnapshot(s=>{ state.settings=s.exists?s.data():null; _fmtTz=null; renderAll(); },()=>{});
  }
  ["weeks","deadlines","recurring","courses","inbox"].forEach(coll=>db.collection(coll).onSnapshot(snap=>{
    state[coll]=snap.docs.map(d=>({...d.data(),_id:d.id})); got.add(coll); renderAll();
  },()=>fail(L().connLost)));
  try{const tb=localStorage.getItem("v2-tab"); if(tb&&document.querySelector(`[data-view="${tb}"]`)) showTab(tb);}catch(e){}
  setInterval(()=>{ renderToday(); if(curTab==="week") renderWeek(); },60000);
})();
</script>
